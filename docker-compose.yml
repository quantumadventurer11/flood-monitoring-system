services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: flooddb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/flooddb
      COPERNICUS_USER: ${COPERNICUS_USER:-}
      COPERNICUS_PASSWORD: ${COPERNICUS_PASSWORD:-}
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000,https://*.vercel.app
    ports:
      - "8000:8000"
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
